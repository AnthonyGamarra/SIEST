{% extends 'base.html' %}
{% block body %}
<style>

                center center / cover no-repeat fixed !important;
  }
</style>

<div class="rg-wrapper position-relative" style="background:transparent;">
  <div class="rg-header">
    <div class="rg-heading">
      <h1 class="rg-title">Histórico CE</h1>

    {% if back_url %}
      <a href="{{ back_url }}" class="btn-back">← Volver a Reportes</a>

        <img src="{{ url_for('static', filename='clipboard_2554234.png') }}" alt="Histórico de Atenciones - CE - 2023">
        <span>Resumen - CE - 2023</span>
      </div>
    </a>

    <a href="https://app.powerbi.com/view?r=eyJrIjoiMjg4MDMzNmMtMjhhZS00ODlkLWI0YjMtOWYxYTc1NWE1NzY1IiwidCI6IjM0ZjMyNDE5LTFjMDUtNDc1Ni04OTZlLTQ1ZDYzMzcyNjU5YiIsImMiOjR9" class="module-link" data-url="https://app.powerbi.com/view?r=eyJrIjoiMjg4MDMzNmMtMjhhZS00ODlkLWI0YjMtOWYxYTc1NWE1NzY1IiwidCI6IjM0ZjMyNDE5LTFjMDUtNDc1Ni04OTZlLTQ1ZDYzMzcyNjU5YiIsImMiOjR9" data-title="Histórico de Atenciones - CE - 2024">
      <div class="module">
        <img src="{{ url_for('static', filename='clipboard_2554234.png') }}" alt="Histórico de Atenciones - CE - 2024">
        <span>Resumen - CE - 2024</span>
      </div>
    </a>

    <a href="https://app.powerbi.com/view?r=eyJrIjoiN2Q3OTk3YjEtOTVkYy00MjJkLWI4ZGYtNmNlODM3YTc2ZTg5IiwidCI6IjM0ZjMyNDE5LTFjMDUtNDc1Ni04OTZlLTQ1ZDYzMzcyNjU5YiIsImMiOjR9" class="module-link" data-url="https://app.powerbi.com/view?r=eyJrIjoiN2Q3OTk3YjEtOTVkYy00MjJkLWI4ZGYtNmNlODM3YTc2ZTg5IiwidCI6IjM0ZjMyNDE5LTFjMDUtNDc1Ni04OTZlLTQ1ZDYzMzcyNjU5YiIsImMiOjR9" data-title="Histórico de Atenciones - CE - 2025">
      <div class="module">
        <img src="{{ url_for('static', filename='clipboard_2554234.png') }}" alt="Histórico de Atenciones - CE - 2025">
        <span>Resumen - CE - 2025</span>
      </div>
    </a>

    <a href="https://app.powerbi.com/view?r=eyJrIjoiM2Y5YmNjNmYtNWExMy00YzQxLWI4YmMtMmE1NzAwYTkyMzE5IiwidCI6IjM0ZjMyNDE5LTFjMDUtNDc1Ni04OTZlLTQ1ZDYzMzcyNjU5YiIsImMiOjR9" class="module-link" data-url="https://app.powerbi.com/view?r=eyJrIjoiM2Y5YmNjNmYtNWExMy00YzQxLWI4YmMtMmE1NzAwYTkyMzE5IiwidCI6IjM0ZjMyNDE5LTFjMDUtNDc1Ni04OTZlLTQ1ZDYzMzcyNjU5YiIsImMiOjR9" data-title="Histórico de Atenciones - CE - 2026">
      <div class="module">
        <img src="{{ url_for('static', filename='clipboard_2554234.png') }}" alt="Histórico de Atenciones - CE - 2026">
        <span>Resumen - CE - 2026</span>
      </div>
    </a>

    <div class="module inactive">
      <img src="{{ url_for('static', filename='clipboard_2554234.png') }}" alt="Reportes Adicionales">
      <span>Reportes Adicionales</span>
    </div>
  </div>

  <div class="modal fade" id="rgModal" tabindex="-1" aria-labelledby="rgModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen-lg-down modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="rgModalTitle">Reporte histórico seleccionado</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <iframe id="rg-modal-iframe" title="Reporte histórico"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const links = document.querySelectorAll('.module-link');
    const modalElement = document.getElementById('rgModal');
    const iframe = document.getElementById('rg-modal-iframe');
    const modalTitle = document.getElementById('rgModalTitle');
    const modalInstance = modalElement ? new bootstrap.Modal(modalElement) : null;

    if (modalElement) {
      modalElement.addEventListener('hidden.bs.modal', function () {
        iframe.src = '';
      });
    }

    links.forEach(link => {
      link.addEventListener('click', function(evt) {
        const url = this.dataset.url || this.href;
        if (!url || !modalInstance) return;
        evt.preventDefault();

        iframe.src = url;
        if (modalTitle) {
          modalTitle.textContent = this.dataset.title || 'Reporte histórico seleccionado';
        }
        modalInstance.show();
      });
    });
  });
</script>
{% endblock %}
