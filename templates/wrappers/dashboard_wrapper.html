{% extends "base.html" %}

{% block body %}
<div id="dashboard-wrapper" style="width: 100%; border: none; display: flex; min-height: 0;">
    <iframe 
        src="{{ dashboard_url }}" 
                style="width: 100%; height: 100%; border: none; display: block; flex: 1 1 auto; min-height: 0;"
        title="Consulta Externa Dashboard">
    </iframe>
</div>
<script>
    (function () {
        var wrapper = document.getElementById('dashboard-wrapper');
        if (!wrapper) {
            return;
        }

        function resizeWrapper() {
            var header = document.querySelector('.header');
            var headerHeight = header ? header.offsetHeight : 0;
            var available = window.innerHeight - headerHeight;
            wrapper.style.height = Math.max(available, 240) + 'px';
        }

        resizeWrapper();
        window.addEventListener('resize', resizeWrapper);
    })();
</script>
{% endblock %}
